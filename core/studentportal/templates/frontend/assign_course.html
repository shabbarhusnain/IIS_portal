{% extends 'base.html'%}
{%block start%}
<style>
.student-shell{min-height:100vh;background:linear-gradient(135deg,#f8fafc 0%,#eef5ff 100%);padding:48px 32px}
.form-card{max-width:720px;margin:auto;background:#fff;border:1px solid rgba(226,232,240,.9);border-radius:24px;box-shadow:var(--shadow-strong);overflow:hidden}
.form-head{padding:26px 34px;background:linear-gradient(135deg,var(--navy),var(--navy-deep));color:#fff;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px}
.form-head h1{font-size:22px;font-weight:750;margin:0}
.form-body{padding:34px}
.field{margin-bottom:20px}
.field label{display:block;font-size:13px;font-weight:700;color:#334155;margin-bottom:8px}
.field input{width:100%;min-height:48px;border:1px solid #dbe2ea;border-radius:12px;padding:0 14px;font-size:15px;color:var(--ink);background:#fff;transition:.2s;box-sizing:border-box;font-family:var(--font-body)}
.field input:focus{border-color:var(--blue);box-shadow:0 0 0 4px rgba(37,99,235,.10);outline:none}
.actions{display:flex;justify-content:flex-end;gap:12px;margin-top:6px;padding-top:22px;border-top:1px solid var(--line)}
@media(max-width:700px){.student-shell{padding:70px 14px 22px}.form-head,.form-body{padding:22px}.actions{justify-content:stretch;flex-direction:column-reverse}.btn-main{width:100%;text-align:center}}
</style>

<div class="student-shell">
  <form class="form-card" method="post">
    {% csrf_token %}
    <div class="form-head">
      <h1>Assign Course</h1>
      <div style="display:flex;gap:8px;flex-wrap:wrap">
        <span class="pill" style="background:rgba(255,255,255,.12);color:#fff;border-color:rgba(255,255,255,.2)">Dept: {{semester.department}}</span>
        <span class="pill" style="background:rgba(255,255,255,.12);color:#fff;border-color:rgba(255,255,255,.2)">Semester: {{semester.semester}}</span>
      </div>
    </div>
    <div class="form-body">
      <div class="field">
        <label>Course Title</label>
        <input name="coursetitle" type="text" required>
      </div>
      <div class="field">
        <label>Course Code</label>
        <input name="coursecode" type="text" required>
      </div>
      <div class="field">
        <label>Credit Hours</label>
        <input name="coursecredit" type="number" min="1" max="6" required>
      </div>
      <div class="actions">
        <a href="{% url 'view_courses' id=semester.id %}" class="back-btn">← Back to List</a>
        <button type="submit" class="btn-main">Assign Course</button>
      </div>
    </div>
  </form>
</div>
{%endblock%}

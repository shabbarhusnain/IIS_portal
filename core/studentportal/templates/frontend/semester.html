{% extends 'base.html' %}
{% block start %}
<style>
.page{min-height:100vh;background:var(--soft);padding:40px 32px}
.wrap{max-width:1050px;margin:auto}
.crumb{display:flex;gap:10px;align-items:center;margin-bottom:24px;flex-wrap:wrap}
.head{background:linear-gradient(135deg,var(--navy),var(--navy-deep));color:#fff;border-radius:22px;padding:28px;margin-bottom:20px;box-shadow:var(--shadow-strong)}
.head .eyebrow{color:#7dd3fc;font-size:12px;text-transform:uppercase;letter-spacing:.13em;font-weight:800}
.head h1{margin:6px 0 0;font-size:28px}
.table-card{background:#fff;border:1px solid var(--line);border-radius:20px;overflow:hidden;box-shadow:var(--shadow-soft)}
table{margin:0!important}
thead{background:#f8fafc}
th{border:0!important;color:var(--muted)!important;font-size:12px;text-transform:uppercase;letter-spacing:.08em;padding:17px!important}
td{padding:18px!important;vertical-align:middle!important;border-color:#eef2f7!important;color:#334155;border-bottom:1px solid #eef2f7}
tbody tr:hover{background:#f8fbff}
.semester-link{display:inline-flex;align-items:center;color:var(--blue);font-weight:750;text-decoration:none}
.semester-link:after{content:'→';margin-left:8px;transition:.15s}
.semester-link:hover:after{margin-left:12px}
@media(max-width:650px){.page{padding:70px 16px 30px}}
</style>
<div class="page"><div class="wrap">
  <div class="crumb">
    <a href="/std_portal/" class="back-btn">← Back to List</a>
    <span class="pill">Department: {{department.depart}}</span>
  </div>
  <div class="head"><div class="eyebrow">Academic Structure</div><h1>Semesters</h1></div>
  <div class="table-card">
    <table class="table">
      <thead><tr><th>Sr</th><th>Semester</th></tr></thead>
      <tbody>
        {% for semester in semesters %}
        <tr><td>{{forloop.counter}}</td><td><a class="semester-link" href="{% url 'students' id=semester.id %}">{{semester}}</a></td></tr>
        {% endfor %}
      </tbody>
    </table>
  </div>
</div></div>
{% endblock %}

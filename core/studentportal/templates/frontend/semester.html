{% extends 'base.html' %}
{% block start %}
<style>
.page{min-height:calc(100vh - 40px);background:#f6f8fc;padding:40px 18px}.wrap{max-width:1050px;margin:auto}.crumb{display:flex;gap:10px;align-items:center;margin-bottom:24px}.back{color:#475569;text-decoration:none;font-weight:700}.dept{background:#eff6ff;color:#2563eb;border:1px solid #dbeafe;border-radius:10px;padding:8px 13px;font-weight:750}.head{background:linear-gradient(135deg,#0b1220,#172554);color:#fff;border-radius:22px;padding:28px;margin-bottom:20px}.head .eyebrow{color:#7dd3fc;font-size:12px;text-transform:uppercase;letter-spacing:.13em;font-weight:800}.head h1{margin:6px 0 0;font-size:28px}.table-card{background:#fff;border:1px solid #e5eaf1;border-radius:20px;overflow:hidden;box-shadow:0 12px 30px rgba(15,23,42,.05)}table{margin:0!important}thead{background:#f8fafc}th{border:0!important;color:#64748b!important;font-size:12px;text-transform:uppercase;letter-spacing:.08em;padding:17px!important}td{padding:18px!important;vertical-align:middle!important;border-color:#eef2f7!important;color:#334155}tbody tr:hover{background:#f8fbff}.semester-link{display:inline-flex;align-items:center;color:#2563eb;font-weight:750;text-decoration:none}.semester-link:after{content:'→';margin-left:8px}
</style>
<div class="page"><div class="wrap">
  <div class="crumb"><a href="/std_portal/" class="back">← Back to List</a>
    <span class="dept">Department: {{department.depart}}</span></div>
  <div class="head"><div class="eyebrow">Academic Structure</div><h1>Semesters</h1></div>
  <div class="table-card">
    <table class="table">
      <thead><tr><th>Sr</th><th>Semester</th></tr></thead>
      <tbody>{% for semester in semesters %}<tr><td>{{forloop.counter}}</td><td><a class="semester-link" href="{% url 'students' id=semester.id %}">{{semester}}</a></td></tr>{% endfor %}</tbody>
    </table>
  </div>
</div></div>
{% endblock %}

{% extends 'base.html'%}
{%block start%}
<style>
.student-shell{min-height:100vh;background:linear-gradient(135deg,#f8fafc 0%,#eef5ff 100%);padding:48px 32px}
.form-card{max-width:640px;margin:auto;background:#fff;border:1px solid rgba(226,232,240,.9);border-radius:24px;box-shadow:var(--shadow-strong);overflow:hidden}
.form-head{padding:30px 34px;background:linear-gradient(135deg,var(--navy),var(--navy-deep));color:#fff}
.form-head h1{font-size:24px;font-weight:750;margin:0}
.form-head p{margin:7px 0 0;color:#b9c6da;font-size:14px}
.form-body{padding:34px}
.field{margin-bottom:24px}
.field label{display:block;font-size:13px;font-weight:700;color:#334155;margin-bottom:8px}
.field input{width:100%;min-height:48px;border:1px solid #dbe2ea;border-radius:12px;padding:0 14px;font-size:15px;color:var(--ink);background:#fff;transition:.2s;box-sizing:border-box;font-family:var(--font-body)}
.field input:focus{border-color:var(--blue);box-shadow:0 0 0 4px rgba(37,99,235,.10);outline:none}
.actions{display:flex;justify-content:flex-end;gap:12px;margin-top:6px;padding-top:22px;border-top:1px solid var(--line)}
@media(max-width:700px){.student-shell{padding:70px 14px 22px}.form-head,.form-body{padding:24px}.actions{justify-content:stretch;flex-direction:column-reverse}.btn-main{width:100%;text-align:center}}
</style>

<div class="student-shell">
  <form class="form-card" method="post">
    {% csrf_token %}
    <div class="form-head">
      <h1>Add Department</h1>
      <p>Create a new academic department.</p>
    </div>
    <div class="form-body">
      <div class="field">
        <label>Department Name</label>
        <input name="department" type="text" required placeholder="e.g. Computer Science">
      </div>
      <div class="actions">
        <a href="/std_portal/" class="back-btn">← Back to List</a>
        <button type="submit" class="btn-main">Add Department</button>
      </div>
    </div>
  </form>
</div>
{%endblock%}

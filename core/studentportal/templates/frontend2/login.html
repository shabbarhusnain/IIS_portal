{% extends 'base.html' %}
{% block start %}
<style>
.auth-wrap{min-height:calc(100vh - 40px);display:flex;align-items:center;justify-content:center;padding:35px 16px;background:radial-gradient(circle at 20% 10%,#dbeafe,transparent 35%),linear-gradient(135deg,#f8fafc,#eef4ff)}
.auth-card{width:100%;max-width:430px;background:#fff;border:1px solid #e4e9f0;border-radius:24px;padding:36px;box-shadow:0 25px 70px rgba(15,23,42,.11)}
.brand-mark{width:48px;height:48px;border-radius:14px;background:linear-gradient(135deg,#2563eb,#06b6d4);display:grid;place-items:center;color:#fff;font-weight:900;margin-bottom:22px}
.auth-card h1{font-size:30px;color:#0f172a;font-weight:800;margin:0}.sub{color:#64748b;margin:8px 0 28px}
.field{margin-bottom:18px}.field label{display:block;font-size:13px;font-weight:700;color:#334155;margin-bottom:8px}.field input{width:100%;height:50px;box-sizing:border-box;border:1px solid #dbe2ea;border-radius:12px;padding:0 14px;font-size:15px}.field input:focus{outline:none;border-color:#2563eb;box-shadow:0 0 0 4px rgba(37,99,235,.1)}
.auth-btn{width:100%;height:50px;border:0;border-radius:12px;background:linear-gradient(135deg,#2563eb,#06b6d4);color:#fff;font-weight:800;font-size:15px;cursor:pointer}.register-link{text-align:center;margin:20px 0 0;color:#64748b;font-size:14px}.register-link a{color:#2563eb;font-weight:700;text-decoration:none}
</style>
<div class="auth-wrap">
  <form class="auth-card" method="post">
    {% csrf_token %}
    <div class="brand-mark">S</div>
    <h1>Welcome back</h1><p class="sub">Sign in to your student management portal.</p>
    {% if messages %}{% for message in messages %}<div class="alert alert-primary">{{message}}</div>{% endfor %}{% endif %}
    <div class="field"><label>Username</label><input type="text" name="username" required placeholder="Enter your username"></div>
    <div class="field"><label>Password</label><input type="password" name="password" required placeholder="Enter your password"></div>
    <button type="submit" class="auth-btn">Sign In</button>
    <p class="register-link">Don't have an account? <a href="/register/">Create account</a></p>
  </form>
</div>
{% endblock %}
